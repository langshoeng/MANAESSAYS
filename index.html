<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>

:root{--bg:#eef1f4;--panel:#fff;--ink:#1c2430;--mute:#5d6b7a;--line:#d5dce3;--accent:#1b6b73;--accent-ink:#fff;--hl:#fde9a8;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--panel:#1a2129;--ink:#e6ebf0;--mute:#93a0ae;--line:#2c3640;--accent:#5fc0c8;--accent-ink:#0c1418;--hl:#4a4020;--danger:#f2b8b5}}
:root[data-theme="dark"]{--bg:#12171d;--panel:#1a2129;--ink:#e6ebf0;--mute:#93a0ae;--line:#2c3640;--accent:#5fc0c8;--accent-ink:#0c1418;--hl:#4a4020;--danger:#f2b8b5}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
aside h2{margin:0;font-size:1.15rem}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search],#eTitle,#eBody,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
select{width:auto;padding:7px 8px}
#list{display:flex;flex-direction:column;gap:4px;overflow:auto;max-height:calc(100vh - 170px)}
.item{text-align:left;border:1px solid transparent;border-radius:8px;padding:8px 10px;background:none}
.item[aria-current=true]{background:var(--bg);border-color:var(--line)}
.item b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--mute)}
main{min-width:0}
#content{padding:28px clamp(16px,4vw,48px)}
#doc{max-width:760px}
h1{font:600 1.9rem/1.25 Literata,Georgia,serif;margin:0 0 4px;overflow-wrap:anywhere}
#eTitle{font:600 1.5rem/1.3 Literata,Georgia,serif}
#meta{color:var(--mute);margin:0 0 16px;font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp+.grp{margin-left:8px;padding-left:12px;border-left:1px solid var(--line)}
.lbl{color:var(--mute);font-size:.85rem}
label.lbl{display:flex;gap:6px;align-items:center;cursor:pointer}
.body,#eBody{font:1.08rem/1.8 Literata,Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}
#eBody{min-height:55vh;resize:vertical}
.s.on{background:var(--hl);border-radius:3px}
#empty{color:var(--mute);max-width:46ch;padding-top:12vh}
#manage{display:flex;gap:10px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
.danger.armed{background:var(--danger);color:var(--bg);border-color:var(--danger)}
#credit{margin:auto 0 0;padding-top:12px;border-top:1px solid var(--line);color:var(--mute);font-size:.85rem}
#imp{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#imp .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:640px;max-height:85vh;overflow:auto}
#imp h2{margin:0 0 4px}
#impList{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px}
.row input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.row small{display:block;color:var(--mute);margin-top:4px;overflow-wrap:anywhere}
#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.tb-title{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menuBtn{display:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
#settings{position:fixed;top:calc(env(safe-area-inset-top,0px) + 60px);right:12px;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 100px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;z-index:25;box-shadow:0 8px 28px rgba(0,0,0,.2)}
#settings h3{margin:0 0 10px;font-size:.95rem}
#settings hr{border:0;border-top:1px solid var(--line);margin:14px 0}
label.fld{flex-direction:column;align-items:stretch;gap:4px;margin-bottom:12px}
label.fld select,label.fld input[type=range]{width:100%}
#editBar{position:sticky;bottom:0;z-index:10;background:var(--panel);margin:20px 0 0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-bottom:0}
#sync{margin:0;color:var(--mute);font-size:.8rem}
#toast{z-index:60;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
[hidden]{display:none!important}
@media (max-width:760px){
.app{grid-template-columns:1fr}
aside{position:fixed;top:0;left:0;bottom:0;width:min(86vw,320px);z-index:40;overflow:auto;visibility:hidden;transform:translateX(-102%);transition:transform .2s,visibility .2s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
aside.open{visibility:visible;transform:none}
#list{max-height:none;flex:1;overflow:visible}
#menuBtn{display:inline-flex;align-items:center}
button,select{min-height:44px}
.item{padding:12px 10px}
#content{padding:16px 16px 24px}
.hint{display:none}
#manage button{flex:1}
}
@media (prefers-reduced-motion:reduce){#toast,aside{transition:none}}

.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px}
.tabs button{min-width:0;padding-left:2px;padding-right:2px;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-h{margin:12px 0 2px;padding:0 10px;color:var(--mute);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.gh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.gh button{white-space:nowrap;flex:none}
#gBody p{margin:.5rem 0}
#gBody h3{margin:1.5rem 0 .3rem;font-size:1.05rem}
#gBody ul{padding-left:1.2rem;margin:.5rem 0}#gBody li{margin:.3rem 0}
.kv .k{display:inline-block;min-width:4.8rem;color:var(--mute);font-weight:600;margin-right:6px}
.formula{font-family:ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;overflow-wrap:anywhere}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px}
#gBody table{border-collapse:collapse;width:100%;min-width:480px;font-size:.92rem}
#gBody th{background:var(--bg);text-align:left;white-space:nowrap}
#gBody th,#gBody td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
#gBody tr:last-child td{border-bottom:0}
#gBody td:first-child{font-weight:600}
#gNav{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
#gNav button{flex:1}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}
.opt:disabled{opacity:1;color:var(--ink);cursor:default}
.opt.ok{border:2px solid var(--accent);background:var(--bg)}
.opt.bad{border:2px solid var(--danger)}
.exp{margin-top:12px;padding:12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:6px}
.prog{color:var(--mute);font-size:.85rem;margin:14px 0 4px}
.qtext{font:600 1.12rem/1.5 Literata,Georgia,serif;margin:4px 0 10px}
.term{padding:14px 0;border-bottom:1px solid var(--line)}
.term .th{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.term b{font-size:1.05rem}
.pri{color:var(--accent);white-space:nowrap;font-size:.85rem}
.term p{margin:.35rem 0}
.term .ex{color:var(--mute)}
.term.flash{background:var(--hl);border-radius:6px;padding-left:8px;padding-right:8px}
.sv{padding:4px 10px;font-size:.85rem;margin-top:4px}
.card{border:1px solid var(--line);border-radius:12px;padding:22px;margin:12px 0;min-height:150px}
.card .big{font:600 1.5rem/1.3 Literata,Georgia,serif;margin:0 0 10px}
#tNav{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
#tNav button{flex:1}
.note{margin:14px 0;padding:12px 14px;border-left:3px solid var(--accent);background:var(--bg);border-radius:6px;font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}
.chk input{margin-top:5px;flex:none}
.chip{display:inline-block;font-size:.7rem;font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.mp{margin:16px 0;line-height:1.75}
.mp h4{margin:0 0 4px;font-size:.95rem;color:var(--mute)}
.mq{font-weight:600;margin:10px 0}
.pl{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.pl label{display:flex;flex-direction:column;gap:3px;margin:10px 0;font-size:.85rem;color:var(--mute)}
.pl input,.pl select,.pl textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}
.pl .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:.9rem/1.6 Figtree,system-ui,sans-serif;margin:12px 0 8px}
#wNav{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
#wNav button{flex:1}
.ul{text-decoration:underline;text-underline-offset:3px;font-weight:600}
.ul sup{font-size:.7em;color:var(--accent);margin-right:2px;text-decoration:none;display:inline-block}
#side>*{max-width:100%}
.qa{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.qa summary{cursor:pointer;font-weight:600}
#pinBtn{flex:none;padding:0 12px;font-size:1.25rem;line-height:1.2;min-height:36px}
#pinBtn.on{color:var(--accent);border-color:var(--accent)}
.qtext{white-space:pre-line}
.mwrap{display:grid;gap:10px;margin:10px 0}
@media (min-width:760px){.mwrap{grid-template-columns:1fr 1.7fr}}
.mcol{display:grid;gap:8px;align-content:start}
.mt,.md{display:block;width:100%;text-align:left;padding:10px 12px;margin:0}
.mt.sel,.md.sel{border:2px solid var(--accent);background:var(--bg)}
.mt.mok,.md.mok{border:2px solid var(--accent);background:var(--bg)}
.mt:disabled,.md:disabled{opacity:1;color:var(--ink);cursor:default}
.mt.mbad,.md.mbad{border:2px solid var(--danger)}
.lcard{border:1px solid var(--line);border-radius:12px;padding:20px;margin:12px 0;min-height:200px}
.lcard .big{font:600 1.6rem/1.3 Literata,Georgia,serif;margin:0 0 12px}
.lcard p{margin:.5rem 0}
.lcard .s{display:block;padding:4px 6px;border-radius:6px}
.lset{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:8px 0}
.pass{max-height:42vh;overflow:auto;padding:6px 8px 0 0;font-family:Literata,Georgia,serif;line-height:1.7}
.pass p{margin:.5rem 0}
.qw label.qf{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.qw .qn{font-weight:600}
.qw textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit}
.qw small{color:var(--mute)}
.qw .draft{font-family:Literata,Georgia,serif;line-height:1.7}
details.st{border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:12px 0}
details.st summary{font-weight:600;cursor:pointer}
.gt textarea,.gt input[type=number],.gt input:not([type]){background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit}
.gt textarea{width:100%;margin-bottom:8px}
.gbig{font:600 clamp(1.6rem,6vw,2.4rem)/1.2 Literata,Georgia,serif;text-align:center;padding:26px 12px;border:1px solid var(--line);border-radius:12px;margin:12px 0;min-height:110px;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.trow{display:flex;gap:6px;align-items:center;margin:8px 0}
.trow input{flex:1;min-width:0}
.tscore{min-width:2.6ch;text-align:center;font:600 1.5rem Figtree,system-ui,sans-serif}
.bcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.bcard{border:2px solid var(--ink);border-radius:8px;padding:8px;break-inside:avoid}
.bgrid{display:grid;gap:4px}
.bcell{border:1px solid var(--line);border-radius:4px;padding:10px 4px;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;overflow-wrap:anywhere}
@media print{body.printing *{visibility:hidden}body.printing .bprint,body.printing .bprint *{visibility:visible}body.printing .bprint{position:absolute;left:0;top:0;width:100%}}
.lpf{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.lpl{font-weight:600;font-size:.9rem}
.lpf input,.lpf select,.lpf textarea,#lpBody .trow input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit}
.stg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0}
#lpBody .trow button{flex:none}
.lpprint{background:#fff;color:#000;font-family:Figtree,Arial,sans-serif;font-size:11pt}
.lpprint table{border-collapse:collapse;width:100%;margin:6px 0}
.lpprint th,.lpprint td{border:1px solid #555;padding:4px 6px;vertical-align:top;text-align:left}
.lpprint h1{font-size:20pt;margin:0}.lpprint h2{font-size:14pt;margin:2px 0 8px}.lpprint h3{font-size:12pt;margin:12px 0 4px}
.cgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:10px 0}
.cday{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cday.today{border:2px solid var(--accent)}
.clesson{display:block;width:100%;text-align:left;padding:8px 10px;margin:0;overflow-wrap:anywhere}
.clesson small{display:block;color:var(--mute)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:10px 0}
.mhead{text-align:center;font-size:.8rem;color:var(--mute);font-weight:600}
.mcell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;padding:4px 2px;margin:0;gap:2px}
.mcell.out{opacity:.45}
.mcell.today{border:2px solid var(--accent)}
.mcell.sel{background:var(--bg);box-shadow:inset 0 0 0 2px var(--ink)}
.mbadge{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 6px;font-size:.75rem;font-weight:600}
#lpBackBar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:15;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#lpBackBtn{width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
<aside id="side" aria-label="Essays">
  <h2>My Library</h2>
  <div class="tabs" role="tablist"><button id="tabE" class="primary">Essays</button><button id="tabG">Grammar</button><button id="tabT">Terms</button><button id="tabX">Exam</button><button id="tabP">Games</button><button id="tabL">Planner</button></div>
  <div class="tabs" id="subTabs"><button id="subM" class="primary">My essays</button><button id="subW">Writing guide</button></div>
  <input type="search" id="q" placeholder="Search titles" aria-label="Search">
  <label class="lbl" id="starRow" hidden style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="starOnly"> Saved for review only</label>
  <div id="list"></div>
  <p id="credit">Created by MANA</p>
</aside>
<div id="scrim" hidden></div>
<main>
  <header id="topbar">
    <button id="menuBtn" aria-label="Open essays">&#9776;</button>
    <div class="tb-title" id="tbTitle">My Essays</div>
    <div class="grp" id="player" hidden><button id="playBtn">Listen</button><button id="stopBtn" hidden>Stop</button></div>
    <button id="setBtn" aria-label="Settings" aria-expanded="false">&#9881;</button>
  </header>
  <div id="lpBackBar" hidden><button id="lpBackBtn" class="primary"></button></div>
  <section id="settings" hidden aria-label="Settings">
    <div id="tts">
      <h3>Listening</h3>
      <label class="lbl fld">Voice <select id="voice"></select></label>
      <label class="lbl fld">Speed <select id="rate"><option value="0.7">0.7x</option><option value="0.85">0.85x</option><option value="1" selected>1x</option><option value="1.15">1.15x</option><option value="1.3">1.3x</option></select></label>
      <label class="lbl fld">Pitch <input type="range" id="pitch" min="0.7" max="1.3" step="0.05" value="1"></label>
      <label class="lbl fld">Pause between sentences <select id="pause"><option value="0">None</option><option value="300" selected>Short</option><option value="600">Medium</option><option value="900">Long</option></select></label>
      <label class="lbl"><input type="checkbox" id="auto"> Auto-play next</label>
      <label class="lbl"><input type="checkbox" id="preferRec" checked> Prefer my recording when available</label>
      <label class="lbl"><input type="checkbox" id="pinnedOnly"> Auto-play pinned essays only</label>
      <label class="lbl"><input type="checkbox" id="shuffle"> Shuffle order for Auto-play next</label>
      <div class="grp" style="margin-top:12px"><button id="testVoice">Test voice</button><span class="lbl">&#9733; = higher quality voice</span></div>
    </div>
  </section>
  <div id="content">
    <div id="empty"><h1>Welcome</h1><p>Open the menu and choose an essay or a grammar section.</p></div>
    <article id="doc" hidden>
      <h1 id="vTitle"></h1>
      <p id="meta"></p>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-8px 0 12px"><p id="status" class="lbl" style="margin:0"></p><button id="pinBtn" aria-pressed="false" aria-label="Pin this essay" title="Pin this essay">&#9734;</button></div>
      <div class="grp" id="src" hidden><button id="srcVoice" class="primary">Default voice</button><button id="srcRec">My recording</button></div>
      <button id="tapBtn" class="primary" hidden style="margin:10px 0">Tap to continue playing</button>
      <audio id="aud" controls preload="metadata" hidden style="width:100%;margin:14px 0"></audio>
      <div class="body" id="vBody"></div>
      <div class="grp" id="eNav" style="margin-top:28px;padding-top:16px;border-top:1px solid var(--line)"><button id="ePrev" style="flex:1">&larr; Previous essay</button><button id="eNext" style="flex:1">Next essay &rarr;</button></div>
    </article>
    <article id="gdoc" hidden>
      <div class="gh"><h1 id="gTitle"></h1><button id="starBtn" aria-pressed="false">&#9734; Save for review</button></div>
      <div class="grp" id="gTabs" hidden style="margin:14px 0 4px"><button id="gLearn" class="primary">Lesson</button><button id="gPractice">Practice</button></div>
      <div id="gBody"></div>
      <div id="pBody" hidden></div>
      <div class="grp" id="gNav"><button id="gPrev">&larr; Previous</button><button id="gNext">Next &rarr;</button></div>
    </article>
    <article id="wdoc" hidden>
      <h1 id="wTitle"></h1>
      <div id="wBody"></div>
      <div class="grp" id="wNav"><button id="wPrev">&larr; Previous</button><button id="wNext">Next &rarr;</button></div>
    </article>
    <article id="lpdoc" hidden><div id="lpBody"></div></article>
    <article id="pdoc" hidden>
      <h1 id="gmTitle"></h1>
      <div id="gmBody"></div>
      <div class="grp" id="gmNav"><button id="gmPrev">&larr; Previous</button><button id="gmNext">Next &rarr;</button></div>
    </article>
    <article id="tdoc" hidden>
      <h1 id="tTitle"></h1>
      <p id="tMeta" class="lbl"></p>

const STOP=new Set('the a an of to and or in on for with by is are was were be that this which it as at from their its into not can may used use when who whom has have had'.split(' '));
const wset=t=>new Set(t.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3&&!STOP.has(w)));
const jac=(a,b)=>{let n=0;a.forEach(x=>{if(b.has(x))n++});return n/((a.size+b.size-n)||1)};

function distract(t){
  const wt=wset(t.d),nt=nl(t.t);
  const ok=x=>x!==t&&jac(wset(x.d),wt)<0.22&&!nl(x.t).includes(nt)&&!nt.includes(nl(x.t))&&nl(x.d)!==nl(t.d);
  let pool=allT.filter(x=>x.sec===t.sec&&ok(x));
  if(pool.length<3)pool=pool.concat(allT.filter(x=>x.sec!==t.sec&&ok(x)));
  return shuffle(pool).slice(0,3);
}
function eligible(t,ty){const n=nl(t.t);return ty==='d2t'?nl(t.d).indexOf(n)<0:ty==='e2t'?nl(t.e).indexOf(n)<0:true}
function makeQ(ty,t){
  const ds=distract(t);if(ds.length<3)return null;
  const ix=shuffle([0,1,2,3]),pick=(c,w)=>{const o=[c,...w];return{o:ix.map(i=>o[i]),a:ix.indexOf(0)}};
  let q,m,fb;
  if(ty==='t2d'){m=pick(t.d,ds.map(x=>x.d));q='What is the best definition of \u201C'+t.t+'\u201D?';fb=t.t+': '+t.d+' Example: '+t.e}
  else if(ty==='e2t'){m=pick(t.t,ds.map(x=>x.t));q='Which term does this example illustrate?\n\u201C'+t.e+'\u201D';fb=t.t+': '+t.d}
  else{m=pick(t.t,ds.map(x=>x.t));q='Which term matches this definition?\n\u201C'+t.d+'\u201D';fb=t.t+': '+t.d+' Example: '+t.e}
  return{q,o:m.o,a:m.a,e:fb,k:'t|'+ty+'|'+t.t};

  shuffle(list.slice()).slice(0,n).forEach(t=>{
    const opts=['d2t','t2d','e2t'].filter(x=>eligible(t,x));
    const ty=type!=='mixed'&&eligible(t,type)?type:opts[Math.floor(Math.random()*opts.length)];
    const q=makeQ(ty,t);if(q)out.push(q)});
  return out;
}

    c.append(el('p','',t.d),el('p','ex','Example: '+t.e));show.remove();
    const g=el('div','grp'),y=el('button','primary','I knew it'),n=el('button','','Review again');
    y.onclick=()=>{cs.known++;cs.i++;renderCard()};n.onclick=()=>{cs.missed.push(t);cs.i++;renderCard()};
    g.append(y,n);box.append(g);
  };
  box.append(c,show);
}
function cardResult(){
  const box=$('#cBody');box.textContent='';
  box.append(el('h3','','Known: '+cs.known+' / '+cs.qs.length),el('p','',cs.missed.length?'Retry the ones you wanted to review again.':'You knew them all. Restart to shuffle and go again.'));
  const g=el('div','grp');g.style.marginTop='14px';
  if(cs.missed.length){const r=el('button','primary','Retry review ('+cs.missed.length+')');r.onclick=()=>startCards(cs.missed.slice(),true);g.append(r)}
  const a=el('button','','Restart all');a.onclick=()=>startCards();const b=el('button','','Back to terms');b.onclick=renderTView;
  g.append(a,b);box.append(g);window.scrollTo(0,0);
}
$('#tCards').onclick=()=>startCards();

/* Grammar */
const stars=new Set(prefs.stars||[]);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function renderBlock(b){
  const x2=renderBlock2(b);if(x2)return x2;
  if(b.t==='p')return el('p','',b.x);
  if(b.t==='h')return el('h3','',b.x);
  if(b.t==='ul'){const u=el('ul');b.items.forEach(x=>u.append(el('li','',x)));return u}
  if(b.t==='kv'){const p=el('p','kv');p.append(el('span','k',b.k),el('span',b.k==='Formula'?'formula':'',b.x));return p}
  const w=el('div','tw'),t=el('table'),hr=el('tr');
  b.head.forEach(h=>hr.append(el('th','',h)));const th=el('thead');th.append(hr);t.append(th);
  const tb=el('tbody');
  b.rows.forEach(r=>{const tr=el('tr');r.forEach((c,i)=>tr.append(el('td',/^formula/i.test(b.head[i]||'')?'formula':'',c)));tb.append(tr)});
  t.append(tb);w.append(t);return w;
}
function renderGList(){
  const f=$('#q').value.trim().toLowerCase(),only=$('#starOnly').checked,box=$('#list');box.textContent='';
  let last='';
  if(!f&&!only&&Object.keys(pbase).length){
    box.append(el('div','grp-h','Practice'));
    [[mixedSec,'Mixed quiz (20 questions)'],[weakSec,'Weak spots ('+weakList().length+')']].forEach(([ps2,t])=>{
      const b=el('button','item');b.setAttribute('aria-current',String(curG===ps2));b.append(el('b','',t));b.onclick=()=>openPseudo(ps2);box.append(b)});
  }
  gram.filter(s=>(!only||stars.has(s.id))&&(!f||s.text.includes(f))).forEach(s=>{
    if(s.group!==last){last=s.group;box.append(el('div','grp-h',s.group))}
    const b=el('button','item');b.setAttribute('aria-current',String(curG===s));
    b.append(el('b','',(stars.has(s.id)?'\u2605 ':'')+s.title));b.onclick=()=>openG(s);box.append(b)});
  if(!box.querySelector('.item'))box.textContent=gram.length?(only?'No saved sections yet.':'No sections found.'):'Could not load grammar.json. Make sure it is uploaded next to index.html.';
}
function updStar(){const on=curG&&stars.has(curG.id);$('#starBtn').textContent=on?'\u2605 Saved':'\u2606 Save for review';$('#starBtn').setAttribute('aria-pressed',String(!!on))}
function openG(s){
  stopSpeech();aud.pause();curG=s;drawer(false);if(gram.indexOf(s)>=0)prefs.lastG=s.id;else if(xsets.indexOf(s)>=0)prefs.lastX=s.id;save();renderList();
  $('#empty').hidden=true;$('#doc').hidden=true;$('#tdoc').hidden=true;$('#wdoc').hidden=true;$('#gdoc').hidden=false;$('#player').hidden=true;
  $('#gTitle').textContent=s.title;updStar();
  const box=$('#gBody');box.textContent='';s.blocks.forEach(b=>box.append(renderBlock(b)));
  const i=gram.indexOf(s);$('#gPrev').disabled=i<=0;$('#gNext').disabled=i>=gram.length-1;
  $('#starBtn').hidden=gram.indexOf(s)<0;$('#gTabs').hidden=!(prac[s.id]&&prac[s.id].length);ps=null;updPractice();showView('lesson');
  window.scrollTo(0,0);
}
const mixedSec={id:'mixed',m:'mixed',group:'Practice',title:'Mixed quiz (20 questions)',blocks:[{t:'p',x:'Twenty random questions drawn from every grammar section that has practice. This is the closest thing to a real exam: you do not know which topic comes next.'}]};
const weakSec={id:'weak',m:'weak',group:'Practice',title:'Weak spots',blocks:[{t:'p',x:'Questions you answered wrongly stay here until you answer them correctly in a later practice. If nothing is listed, you have no weak spots yet. This list is saved on this device.'}]};
function weakKeys(){return new Set(prefs.weak||[])}
function setWeak(k,on){const w=weakKeys();if(on)w.add(k);else w.delete(k);prefs.weak=[...w];save()}
function srcBase(){return tab==='exam'?xbase:pbase}
function weakList(){const w=weakKeys();return Object.values(srcBase()).flat().filter(q=>w.has(q.k))}
function pickMixed(){return shuffle(Object.values(srcBase()).flat()).slice(0,20)}
function openPseudo(s){prac[s.id]=s.m==='mixed'?pickMixed():weakList();openG(s);if(prac[s.id].length)startPractice()}
function updPractice(){
  if(!curG||!prac[curG.id])return;
  const best=(prefs.scores||{})[curG.id];
  $('#gPractice').textContent='Practice ('+prac[curG.id].length+')'+(best!==undefined?' - best '+best:'');
}
function showView(v){
  $('#gBody').hidden=v!=='lesson';$('#pBody').hidden=v!=='practice';$('#gNav').hidden=v==='practice'||gram.indexOf(curG)<0;
  $('#gLearn').classList.toggle('primary',v==='lesson');$('#gPractice').classList.toggle('primary',v==='practice');
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startPractice(list,partial){
  ps={qs:shuffle((list||prac[curG.id]).slice()),i:0,score:0,missed:[],locked:false,partial:!!partial};
  showView('practice');renderQ();
}
function plainQ(t){return t.replace(/\{([ABCD])\|([^}]*)\}/g,'($1) $2')}
function setQ(e,text){
  const re=/\{([ABCD])\|([^}]*)\}/g;let last=0,m;
  while((m=re.exec(text))){
    if(m.index>last)e.append(document.createTextNode(text.slice(last,m.index)));
    const u=el('u','ul');u.append(el('sup','',m[1]),document.createTextNode(' '+m[2]));e.append(u);last=re.lastIndex}
  if(last<text.length)e.append(document.createTextNode(text.slice(last)));
}
function renderQ(){
  const box=$('#pBody');box.textContent='';
  if(ps.i>=ps.qs.length){renderResult();return}
  const q=ps.qs[ps.i];
  const qp=el('p','qtext');setQ(qp,q.q);
  if(curG&&curG.passage){
    const dt=el('details','qa');dt.open=passOpen;dt.append(el('summary','','Passage (tap to hide or show)'));
    const pb=el('div','pass');curG.passage.forEach(x=>pb.append(el('p','',x)));dt.append(pb);dt.ontoggle=()=>{passOpen=dt.open};box.append(dt);
  }
  box.append(el('p','prog','Question '+(ps.i+1)+' of '+ps.qs.length+' - score '+ps.score),qp);
  q.o.forEach((o,k)=>{const b=el('button','opt','ABCD'[k]+'. '+o);b.onclick=()=>answer(k);box.append(b)});
  window.scrollTo(0,0);
}
function answer(k){
  if(ps.locked)return;ps.locked=true;
  const q=ps.qs[ps.i];
  document.querySelectorAll('#pBody .opt').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a){b.classList.add('ok');b.textContent+='  \u2713 correct'}
    else if(i===k){b.classList.add('bad');b.textContent+='  \u2717 your answer'}
  });
  if(k===q.a){ps.score++;if(q.k)setWeak(q.k,false)}else{ps.missed.push(q);if(q.k)setWeak(q.k,true)}
  const fb=el('div','exp'),nx=el('button','primary',ps.i+1>=ps.qs.length?'See results':'Next question');
  fb.append(el('b','',k===q.a?'Correct. ':'Not quite. '),document.createTextNode(q.e));
  nx.style.marginTop='12px';nx.onclick=()=>{ps.i++;ps.locked=false;renderQ()};
  $('#pBody').append(fb,nx);nx.scrollIntoView({block:'nearest'});
}
function renderResult(){
  const box=$('#pBody'),n=ps.qs.length;box.textContent='';
  const sc=prefs.scores=prefs.scores||{};
  if(!ps.partial&&curG.m!=='weak'&&(sc[curG.id]===undefined||ps.score>sc[curG.id])){sc[curG.id]=ps.score;save()}
  updPractice();renderList();
  box.append(el('h3','','Result: '+ps.score+' / '+n),el('p','',ps.missed.length?'Read the explanations for the questions you missed, then retry them.':'Perfect score. Restart to practise again in a new order.'));
  ps.missed.forEach(q=>{const d=el('div','exp');d.append(el('b','',plainQ(q.q)),el('br'),document.createTextNode('Answer: '+q.o[q.a]+'. '+q.e));box.append(d)});
  const g=el('div','grp');g.style.marginTop='16px';
  if(ps.missed.length){const r=el('button','primary','Retry missed ('+ps.missed.length+')');r.onclick=()=>startPractice(ps.missed.slice(),true);g.append(r)}
  const a=el('button','','Restart all');a.onclick=()=>startPractice();
  const l=el('button','','Back to lesson');l.onclick=()=>{ps=null;showView('lesson')};
  g.append(a,l);if(curG.tq){const bt=el('button','','Back to terms');bt.onclick=()=>{ps=null;if(curT)openT(curT);else setTab('terms')};g.append(bt)}box.append(g);window.scrollTo(0,0);
}
$('#gLearn').onclick=()=>{ps=null;showView('lesson')};
$('#gPractice').onclick=()=>startPractice();
$('#gPrev').onclick=()=>{const i=gram.indexOf(curG);if(i>0)openG(gram[i-1])};
$('#gNext').onclick=()=>{const i=gram.indexOf(curG);if(i<gram.length-1)openG(gram[i+1])};
$('#starBtn').onclick=()=>{if(!curG)return;stars.has(curG.id)?stars.delete(curG.id):stars.add(curG.id);prefs.stars=[...stars];save();updStar();renderList()};
$('#starOnly').onchange=renderList;
function setTab(t){
  if(tab==='exam')xcur=curG;else if(tab==='grammar')gcur=curG;
  if(t==='exam')curG=xcur;else if(t==='grammar')curG=gcur;
  tab=t;prefs.tab=t;save();stopSpeech();aud.pause();$('#q').value='';$('#subTabs').hidden=t!=='essays';$('#subM').classList.toggle('primary',sub==='mine');$('#subW').classList.toggle('primary',sub==='guide');
  $('#tabE').classList.toggle('primary',t==='essays');$('#tabG').classList.toggle('primary',t==='grammar');$('#tabT').classList.toggle('primary',t==='terms');$('#tabX').classList.toggle('primary',t==='exam');$('#tabP').classList.toggle('primary',t==='games');$('#tabL').classList.toggle('primary',t==='planner');
  $('#q').placeholder={essays:sub==='guide'?'Search the guide':'Search titles',grammar:'Search grammar',terms:'Search terms',exam:'Search exam sets',games:'Search games',planner:'Search lesson plans'}[t];$('#starRow').hidden=t!=='grammar';
  $('#tbTitle').textContent={essays:'My Essays',grammar:'Grammar Handbook',terms:'Terminology',exam:'Exam Bank',games:'Games & Activities',planner:'Lesson Planner'}[t];
  $('#doc').hidden=true;$('#gdoc').hidden=true;$('#tdoc').hidden=true;$('#wdoc').hidden=true;$('#pdoc').hidden=true;$('#lpdoc').hidden=true;$('#empty').hidden=false;$('#player').hidden=true;
  if(t==='planner'){lpBack=null;showBack();$('#empty').hidden=true;$('#lpdoc').hidden=false;if(curL&&getPlan(curL))openL(curL);else openLHome()}
  if(t==='games'&&curP){$('#empty').hidden=true;$('#pdoc').hidden=false}
  if(t==='essays'&&sub==='guide'&&curW){$('#empty').hidden=true;$('#wdoc').hidden=false}
  if(t==='terms'&&curT){$('#empty').hidden=true;$('#tdoc').hidden=false}
  if(t==='essays'&&sub==='mine'&&cur){$('#empty').hidden=true;$('#doc').hidden=false;setMode(mode)}
  if((t==='grammar'||t==='exam')&&curG)openG(curG);
  renderList();
}
$('#tabE').onclick=()=>setTab('essays');
$('#tabG').onclick=()=>setTab('grammar');
$('#tabT').onclick=()=>setTab('terms');
$('#tabX').onclick=()=>setTab('exam');
$('#tabP').onclick=()=>setTab('games');
$('#tabL').onclick=()=>setTab('planner');
$('#lpBackBtn').onclick=()=>{const id=lpBack;lpBack=null;showBack();setTab('planner');if(id&&getPlan(id))openL(id)};
const flat=b=>[b.x,b.k,(b.items||[]).join(' '),(b.head||[]).join(' '),(b.rows||[]).map(r=>r.join(' ')).join(' ')].filter(Boolean).join(' ');
const eP=fetch('essays.json').then(r=>r.json()).then(d=>{items=d.essays||[]}).catch(()=>{eErr=true});
const pP=fetch('practice.json').then(r=>r.json()).then(d=>{
  pbase=d;prac=Object.assign({},d);
  Object.entries(d).forEach(([sid,arr])=>arr.forEach(q=>{q.sid=sid;q.k=sid+'|'+q.q+'|'+q.o[q.a]}));
}).catch(()=>{});
const wP=fetch('guide.json').then(r=>r.json()).then(d=>{wsecs=d.sections||[];wsecs.forEach(s=>{s.text=(s.title+' '+s.blocks.map(wflat).join(' ')).toLowerCase()})}).catch(()=>{});
const tP=fetch('terminology.json').then(r=>r.json()).then(d=>{
  const secs=d.sections;allT=[];
  secs.forEach(s=>{if(s.kind==='terms')s.terms.forEach(t=>{t.sec=s;t.cat=s.title;allT.push(t)})});
  const k=secs.findIndex(s=>s.kind==='terms');
  tsecs=[...secs.slice(0,k),{id:'must',group:'Quick study',title:'Must-memorize terms (★★★)',kind:'terms'},{id:'saved',group:'Quick study',title:'My saved terms',kind:'terms'},...secs.slice(k)];
}).catch(()=>{});
const gP=fetch('grammar.json').then(r=>r.json()).then(d=>{gram=d.sections||[];gram.forEach(s=>{s.text=(s.title+' '+s.blocks.map(flat).join(' ')).toLowerCase()})}).catch(()=>{});
Promise.all([eP,gP,pP,tP,wP,xP,gmP]).then(()=>{
  Object.keys(xbase).forEach(id=>{prac[id]=xbase[id]});Object.keys(xrd).forEach(id=>{prac[id]=xrd[id]});
  const le=items.find(x=>x.file===prefs.last),lg=gram.find(x=>x.id===prefs.lastG);
  if(le)cur=le;if(lg)curG=lg;
  const lt=tsecs.find(x=>x.id===prefs.lastT);if(lt)curT=lt;
  const lw=wsecs.find(x=>x.id===prefs.lastW);if(lw)curW=lw;sub=prefs.sub==='guide'?'guide':'mine';
  const lx=xsets.find(x=>x.id===prefs.lastX);if(lx)xcur=lx;gcur=curG;
  const lp=gmsecs.find(x=>x.id===prefs.lastP);if(lp)curP=lp;
  setTab(['grammar','terms','exam','games','planner'].includes(prefs.tab)?prefs.tab:'essays');
  if(tab==='essays'&&sub==='mine'&&le)open(le);else if(tab==='essays'&&sub==='guide'&&lw)openW(lw);else if(tab==='grammar'&&lg)openG(lg);else if(tab==='terms'&&lt)openT(lt);else if(tab==='exam'&&lx)openG(lx);else if(tab==='games'&&lp)openP(lp);
});
</script>
