<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>

:root{--bg:#eef1f4;--panel:#fff;--ink:#1c2430;--mute:#5d6b7a;--line:#d5dce3;--accent:#1b6b73;--accent-ink:#fff;--hl:#fde9a8;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--panel:#1a2129;--ink:#e6ebf0;--mute:#93a0ae;--line:#2c3640;--accent:#5fc0c8;--accent-ink:#0c1418;--hl:#4a4020;--danger:#f2b8b5}}
:root[data-theme="dark"]{--bg:#12171d;--panel:#1a2129;--ink:#e6ebf0;--mute:#93a0ae;--line:#2c3640;--accent:#5fc0c8;--accent-ink:#0c1418;--hl:#4a4020;--danger:#f2b8b5}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
aside h2{margin:0;font-size:1.15rem}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search],#eTitle,#eBody,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
select{width:auto;padding:7px 8px}
#list{display:flex;flex-direction:column;gap:4px;overflow:auto;max-height:calc(100vh - 170px)}
.item{text-align:left;border:1px solid transparent;border-radius:8px;padding:8px 10px;background:none}
.item[aria-current=true]{background:var(--bg);border-color:var(--line)}
.item b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--mute)}
main{min-width:0}
#content{padding:28px clamp(16px,4vw,48px)}
#doc{max-width:760px}
h1{font:600 1.9rem/1.25 Literata,Georgia,serif;margin:0 0 4px;overflow-wrap:anywhere}
#eTitle{font:600 1.5rem/1.3 Literata,Georgia,serif}
#meta{color:var(--mute);margin:0 0 16px;font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp+.grp{margin-left:8px;padding-left:12px;border-left:1px solid var(--line)}
.lbl{color:var(--mute);font-size:.85rem}
label.lbl{display:flex;gap:6px;align-items:center;cursor:pointer}
.body,#eBody{font:1.08rem/1.8 Literata,Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}
#eBody{min-height:55vh;resize:vertical}
.s.on{background:var(--hl);border-radius:3px}
#empty{color:var(--mute);max-width:46ch;padding-top:12vh}
#manage{display:flex;gap:10px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
.danger.armed{background:var(--danger);color:var(--bg);border-color:var(--danger)}
#credit{margin:auto 0 0;padding-top:12px;border-top:1px solid var(--line);color:var(--mute);font-size:.85rem}
#imp{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#imp .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:640px;max-height:85vh;overflow:auto}
#imp h2{margin:0 0 4px}
#impList{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px}
.row input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.row small{display:block;color:var(--mute);margin-top:4px;overflow-wrap:anywhere}
#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.tb-title{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menuBtn{display:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
#settings{position:fixed;top:calc(env(safe-area-inset-top,0px) + 60px);right:12px;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 100px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;z-index:25;box-shadow:0 8px 28px rgba(0,0,0,.2)}
#settings h3{margin:0 0 10px;font-size:.95rem}
#settings hr{border:0;border-top:1px solid var(--line);margin:14px 0}
label.fld{flex-direction:column;align-items:stretch;gap:4px;margin-bottom:12px}
label.fld select,label.fld input[type=range]{width:100%}
#editBar{position:sticky;bottom:0;z-index:10;background:var(--panel);margin:20px 0 0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-bottom:0}
#sync{margin:0;color:var(--mute);font-size:.8rem}
#toast{z-index:60;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
[hidden]{display:none!important}
@media (max-width:760px){
.app{grid-template-columns:1fr}
aside{position:fixed;top:0;left:0;bottom:0;width:min(86vw,320px);z-index:40;overflow:auto;visibility:hidden;transform:translateX(-102%);transition:transform .2s,visibility .2s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
aside.open{visibility:visible;transform:none}
#list{max-height:none;flex:1;overflow:visible}
#menuBtn{display:inline-flex;align-items:center}
button,select{min-height:44px}
.item{padding:12px 10px}
#content{padding:16px 16px 24px}
.hint{display:none}
#manage button{flex:1}
}
@media (prefers-reduced-motion:reduce){#toast,aside{transition:none}}

.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px}
.tabs button{min-width:0;padding-left:2px;padding-right:2px;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-h{margin:12px 0 2px;padding:0 10px;color:var(--mute);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.gh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.gh button{white-space:nowrap;flex:none}
#gBody p{margin:.5rem 0}
#gBody h3{margin:1.5rem 0 .3rem;font-size:1.05rem}
#gBody ul{padding-left:1.2rem;margin:.5rem 0}#gBody li{margin:.3rem 0}
.kv .k{display:inline-block;min-width:4.8rem;color:var(--mute);font-weight:600;margin-right:6px}
.formula{font-family:ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;overflow-wrap:anywhere}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px}
#gBody table{border-collapse:collapse;width:100%;min-width:480px;font-size:.92rem}
#gBody th{background:var(--bg);text-align:left;white-space:nowrap}
#gBody th,#gBody td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
#gBody tr:last-child td{border-bottom:0}
#gBody td:first-child{font-weight:600}
#gNav{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
#gNav button{flex:1}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}
.opt:disabled{opacity:1;color:var(--ink);cursor:default}
.opt.ok{border:2px solid var(--accent);background:var(--bg)}
.opt.bad{border:2px solid var(--danger)}
.exp{margin-top:12px;padding:12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:6px}
.prog{color:var(--mute);font-size:.85rem;margin:14px 0 4px}
.qtext{font:600 1.12rem/1.5 Literata,Georgia,serif;margin:4px 0 10px}
.term{padding:14px 0;border-bottom:1px solid var(--line)}
.term .th{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.term b{font-size:1.05rem}
.pri{color:var(--accent);white-space:nowrap;font-size:.85rem}
.term p{margin:.35rem 0}
.term .ex{color:var(--mute)}
.term.flash{background:var(--hl);border-radius:6px;padding-left:8px;padding-right:8px}
.sv{padding:4px 10px;font-size:.85rem;margin-top:4px}
.card{border:1px solid var(--line);border-radius:12px;padding:22px;margin:12px 0;min-height:150px}
.card .big{font:600 1.5rem/1.3 Literata,Georgia,serif;margin:0 0 10px}
#tNav{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
#tNav button{flex:1}
.note{margin:14px 0;padding:12px 14px;border-left:3px solid var(--accent);background:var(--bg);border-radius:6px;font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}
.chk input{margin-top:5px;flex:none}
.chip{display:inline-block;font-size:.7rem;font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.mp{margin:16px 0;line-height:1.75}
.mp h4{margin:0 0 4px;font-size:.95rem;color:var(--mute)}
.mq{font-weight:600;margin:10px 0}
.pl{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.pl label{display:flex;flex-direction:column;gap:3px;margin:10px 0;font-size:.85rem;color:var(--mute)}
.pl input,.pl select,.pl textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}
.pl .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:.9rem/1.6 Figtree,system-ui,sans-serif;margin:12px 0 8px}
#wNav{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
#wNav button{flex:1}
.ul{text-decoration:underline;text-underline-offset:3px;font-weight:600}
.ul sup{font-size:.7em;color:var(--accent);margin-right:2px;text-decoration:none;display:inline-block}
#side>*{max-width:100%}
.qa{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.qa summary{cursor:pointer;font-weight:600}
#pinBtn{flex:none;padding:0 12px;font-size:1.25rem;line-height:1.2;min-height:36px}
#pinBtn.on{color:var(--accent);border-color:var(--accent)}
.qtext{white-space:pre-line}
.mwrap{display:grid;gap:10px;margin:10px 0}
@media (min-width:760px){.mwrap{grid-template-columns:1fr 1.7fr}}
.mcol{display:grid;gap:8px;align-content:start}
.mt,.md{display:block;width:100%;text-align:left;padding:10px 12px;margin:0}
.mt.sel,.md.sel{border:2px solid var(--accent);background:var(--bg)}
.mt.mok,.md.mok{border:2px solid var(--accent);background:var(--bg)}
.mt:disabled,.md:disabled{opacity:1;color:var(--ink);cursor:default}
.mt.mbad,.md.mbad{border:2px solid var(--danger)}
.lcard{border:1px solid var(--line);border-radius:12px;padding:20px;margin:12px 0;min-height:200px}
.lcard .big{font:600 1.6rem/1.3 Literata,Georgia,serif;margin:0 0 12px}
.lcard p{margin:.5rem 0}
.lcard .s{display:block;padding:4px 6px;border-radius:6px}
.lset{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:8px 0}
.pass{max-height:42vh;overflow:auto;padding:6px 8px 0 0;font-family:Literata,Georgia,serif;line-height:1.7}
.pass p{margin:.5rem 0}
.qw label.qf{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.qw .qn{font-weight:600}
.qw textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit}
.qw small{color:var(--mute)}
.qw .draft{font-family:Literata,Georgia,serif;line-height:1.7}
details.st{border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:12px 0}
details.st summary{font-weight:600;cursor:pointer}
.gt textarea,.gt input[type=number],.gt input:not([type]){background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit}
.gt textarea{width:100%;margin-bottom:8px}
.gbig{font:600 clamp(1.6rem,6vw,2.4rem)/1.2 Literata,Georgia,serif;text-align:center;padding:26px 12px;border:1px solid var(--line);border-radius:12px;margin:12px 0;min-height:110px;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.trow{display:flex;gap:6px;align-items:center;margin:8px 0}
.trow input{flex:1;min-width:0}
.tscore{min-width:2.6ch;text-align:center;font:600 1.5rem Figtree,system-ui,sans-serif}
.bcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.bcard{border:2px solid var(--ink);border-radius:8px;padding:8px;break-inside:avoid}
.bgrid{display:grid;gap:4px}
.bcell{border:1px solid var(--line);border-radius:4px;padding:10px 4px;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;overflow-wrap:anywhere}
@media print{body.printing *{visibility:hidden}body.printing .bprint,body.printing .bprint *{visibility:visible}body.printing .bprint{position:absolute;left:0;top:0;width:100%}}
.lpf{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.lpl{font-weight:600;font-size:.9rem}
.lpf input,.lpf select,.lpf textarea,#lpBody .trow input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit}
.stg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0}
#lpBody .trow button{flex:none}
.lpprint{background:#fff;color:#000;font-family:Figtree,Arial,sans-serif;font-size:11pt}
.lpprint table{border-collapse:collapse;width:100%;margin:6px 0}
.lpprint th,.lpprint td{border:1px solid #555;padding:4px 6px;vertical-align:top;text-align:left}
.lpprint h1{font-size:20pt;margin:0}.lpprint h2{font-size:14pt;margin:2px 0 8px}.lpprint h3{font-size:12pt;margin:12px 0 4px}
.cgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:10px 0}
.cday{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cday.today{border:2px solid var(--accent)}
.clesson{display:block;width:100%;text-align:left;padding:8px 10px;margin:0;overflow-wrap:anywhere}
.clesson small{display:block;color:var(--mute)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:10px 0}
.mhead{text-align:center;font-size:.8rem;color:var(--mute);font-weight:600}
.mcell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;padding:4px 2px;margin:0;gap:2px}
.mcell.out{opacity:.45}
.mcell.today{border:2px solid var(--accent)}
.mcell.sel{background:var(--bg);box-shadow:inset 0 0 0 2px var(--ink)}
.mbadge{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 6px;font-size:.75rem;font-weight:600}
#lpBackBar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:15;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#lpBackBtn{width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#bdoc{max-width:1000px}
#bBar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:14;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.brow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#bPg{width:4.2em;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 4px}
#bStage{position:relative;overflow:auto;background:var(--bg);border-radius:8px;touch-action:pan-x pan-y pinch-zoom}
#bStage.sv{height:calc(100vh - 190px);height:calc(100dvh - 190px);min-height:320px}
#bCv{display:block;margin:0 auto;max-width:none;background:#fff}
.bpg{margin:8px auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);overflow:hidden}
#bStage.night canvas{filter:invert(1) hue-rotate(180deg)}
#bStage.night .bpg{background:#000}
#bNav{margin-top:16px}
#bNav button{flex:1}
#bPanel{max-height:50vh;overflow:auto}
#bPanel .hit{display:block;width:100%;text-align:left;margin:6px 0}
#bdoc.bfs{position:fixed;inset:0;z-index:50;max-width:none;margin:0;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.bfs #bTitle,.bfs #bNav{display:none}
.bfs #bMsg{padding:0 8px;margin:4px 0}
.bfs #bBar{position:relative;border-radius:0;border-width:0 0 1px;margin:0}
.bfs #bPanel{margin:0;border-radius:0;max-height:40vh;overflow:auto}
.bfs #bStage,.bfs #bStage.sv{flex:1;min-height:0;height:auto;border-radius:0}
.bfs.nobar #bBar,.bfs.nobar #bPanel{display:none}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:38px;height:38px;padding:0 4px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;flex:none}
#bMark[aria-pressed=true] .ic{fill:currentColor}
.bgrp{display:flex;gap:4px;align-items:center;margin-left:auto}
.bwrap{display:inline-block}
.pop{position:absolute;top:100%;left:0;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.pop[hidden]{display:none}
.zp{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;text-align:center;width:max-content}
.zp #bFit{grid-column:1/-1}
.mn{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(290px,calc(100vw - 40px))}
.mi{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:8px 2px;height:auto;min-height:0}
.mi .ic{width:22px;height:22px}
@media(max-width:480px){.ib{min-width:32px;padding:0 2px}#bPg{width:3em;padding:6px 2px}.brow,.bgrp{gap:2px}}
</style>
</head>
<body>
<div class="app">
<aside id="side" aria-label="Essays">
  <h2>My Library</h2>
  <div class="tabs" role="tablist"><button id="tabE" class="primary">Essays</button><button id="tabG">Grammar</button><button id="tabT">Terms</button><button id="tabX">Exam</button><button id="tabP">Games</button><button id="tabL">Planner</button><button id="tabB">Books</button></div>
  <div class="tabs" id="subTabs"><button id="subM" class="primary">My essays</button><button id="subW">Writing guide</button></div>
  <input type="search" id="q" placeholder="Search titles" aria-label="Search">
  <label class="lbl" id="starRow" hidden style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="starOnly"> Saved for review only</label>
  <div id="list"></div>
  <p id="credit">Created by MANA</p>
</aside>
<div id="scrim" hidden></div>
<main>
  <header id="topbar">
    <button id="menuBtn" aria-label="Open essays">&#9776;</button>
    <div class="tb-title" id="tbTitle">My Essays</div>
    <div class="grp" id="player" hidden><button id="playBtn">Listen</button><button id="stopBtn" hidden>Stop</button></div>
    <button id="setBtn" aria-label="Settings" aria-expanded="false">&#9881;</button>
  </header>
  <div id="lpBackBar" hidden><button id="lpBackBtn" class="primary"></button></div>
  <section id="settings" hidden aria-label="Settings">
    <div id="tts">
      <h3>Listening</h3>
      <label class="lbl fld">Voice <select id="voice"></select></label>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s),PK='essay-viewer-prefs',synth=window.speechSynthesis,aud=$('#aud');
const played=new Set();let shuffleRun=false,nextPick=null,pinRun=false,curL=null,gmsecs=[],curP=null,xrd={},passOpen=true,xsets=[],xbase={},gcur=null,xcur=null,pbase={},runId=0,recWait=null,wsecs=[],curW=null,sub='mine',tsecs=[],allT=[],curT=null,tmin=1,cs=null,prac={},ps=null,gram=[],curG=null,tab='essays',eErr=false,items=[],cur=null,mode='voice',state='idle',tok=0,q=[],qi=0,voices=[],prefs={},tt;
try{prefs=JSON.parse(localStorage.getItem(PK))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(PK,JSON.stringify(prefs))}catch(e){}};
const words=s=>(s.trim().match(/\S+/g)||[]).length;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800)}
function drawer(o){$('#side').classList.toggle('open',o);$('#scrim').hidden=!o}
function settings(o){$('#settings').hidden=!o;$('#setBtn').setAttribute('aria-expanded',String(o))}
function renderList(){tab==='library'?renderBList():tab==='planner'?renderLList():tab==='games'?renderPList():tab==='exam'?renderXList():tab==='grammar'?renderGList():tab==='terms'?renderTList():sub==='guide'?renderWList():renderEList()}
function pinSet(){return new Set(prefs.pins||[])}
function renderEList(){
  const f=$('#q').value.trim().toLowerCase(),box=$('#list');box.textContent='';
  const pins=pinSet(),rows=items.filter(i=>!f||i.title.toLowerCase().includes(f));
  if(!f&&items.length>1){const r=el('div','');r.style.cssText='padding:0 10px 6px';const sa=el('button','sv','Shuffle all essays');sa.onclick=()=>playShuffle(false);r.append(sa);box.append(r)}
  const pinned=rows.filter(i=>pins.has(i.file)),rest=rows.filter(i=>!pins.has(i.file));
  const add=i=>{
    const b=document.createElement('button');b.className='item';b.setAttribute('aria-current',String(cur===i));
    const t=document.createElement('b');t.textContent=(pins.has(i.file)?'\u2605 ':'')+i.title;b.append(t);b.onclick=()=>open(i);box.append(b)};
  if(pinned.length){box.append(el('div','grp-h','Pinned'));const pr=el('div','');pr.style.cssText='display:flex;gap:6px;padding:2px 10px 6px;flex-wrap:wrap';const pb=el('button','sv','\u25B6 Play pinned');pb.onclick=playPinned;const ps2=el('button','sv','Shuffle pinned');ps2.onclick=()=>playShuffle(true);pr.append(pb,ps2);box.append(pr);pinned.forEach(add);if(rest.length)box.append(el('div','grp-h','All essays'))}
  rest.forEach(add);
  if(!box.querySelector('.item'))box.textContent=eErr?'Could not load essays.json. Make sure it is uploaded next to index.html.':'No essays found.';
}
function updPin(){
  const on=!!cur&&pinSet().has(cur.file);
  const b=$('#pinBtn'),t=on?'Unpin this essay':'Pin this essay';
  b.textContent=on?'\u2605':'\u2606';b.title=t;b.setAttribute('aria-label',t);b.setAttribute('aria-pressed',String(on));b.classList.toggle('on',on);
}

function renderBody(text){
  const box=$('#vBody');box.textContent='';
  (text.match(/[^.!?\n]*[.!?]+["')\]]*\s*|[^.!?\n]+|\n+/g)||[]).forEach(p=>{
    if(/^\n+$/.test(p)||!p.trim()){box.append(document.createTextNode(p));return}
    const s=document.createElement('span');s.className='s';s.textContent=p;box.append(s)});
}
async function open(i,auto){
  if(!auto){pinRun=false;shuffleRun=false;played.clear()}
  if(auto)haltSpeech();else stopSpeech();aud.pause();$('#tapBtn').hidden=true;cur=i;played.add(i.file);drawer(false);prefs.last=i.file;save();renderList();
  let txt='';
  try{const r=await fetch(i.file);if(!r.ok)throw 0;txt=await r.text()}catch(e){toast('Could not load this essay.');return false}
  if(cur!==i)return false;
  const lines=txt.replace(/\r/g,'').split('\n');
  if(lines[0].trim()===i.title.trim()){lines.shift();if(lines.length&&!lines[0].trim())lines.shift()}
  const body=lines.join('\n').trim();
  $('#empty').hidden=true;$('#gdoc').hidden=true;$('#wdoc').hidden=true;$('#doc').hidden=false;$('#vTitle').textContent=i.title;
  $('#meta').textContent=words(body)+' words - '+Math.max(1,Math.ceil(words(body)/200))+' min read';
  renderBody(body);$('#src').hidden=true;
  if(i.audio)aud.src=i.audio;else{aud.removeAttribute('src');aud.load()}
  recWait=waitRec();
  setMode('voice');window.scrollTo(0,0);
  updStatus();updPin();setSession();prefetchNext();return true;
}
aud.onloadedmetadata=()=>{$('#src').hidden=false};
aud.onerror=()=>{if(aud.getAttribute('src')){$('#src').hidden=true;setMode('voice')}};
aud.onplay=()=>{aud.playbackRate=parseFloat($('#rate').value)||1};
function setMode(m){
  mode=m;aud.hidden=m!=='rec';$('#player').hidden=m==='rec'||!cur||!synth;
  $('#srcVoice').classList.toggle('primary',m==='voice');$('#srcRec').classList.toggle('primary',m==='rec');
  if(m==='rec')stopSpeech();else aud.pause();
  updStatus();
}
$('#srcVoice').onclick=()=>setMode('voice');
$('#srcRec').onclick=()=>setMode('rec');
function waitRec(){
  return new Promise(res=>{
    if(!aud.getAttribute('src')){res(false);return}
    const done=v=>{clearTimeout(t);aud.removeEventListener('loadedmetadata',ok);aud.removeEventListener('error',bad);res(v)};
    const ok=()=>done(true),bad=()=>done(false),t=setTimeout(()=>done(false),5000);
    aud.addEventListener('loadedmetadata',ok);aud.addEventListener('error',bad);
    if(aud.readyState>=1)done(true);
  });
}
/* Auto-play next: tries "My recording" first for every essay (if the setting is on), otherwise the default voice */
function shuffleOn(){return shuffleRun||$('#shuffle').checked}
function scopePinned(){return pinRun||(!shuffleRun&&$('#pinnedOnly').checked)}
function nextAuto(){
  const p=pinSet();
  if(shuffleOn()){
    const pool=items.filter(x=>(!scopePinned()||p.has(x.file))&&!played.has(x.file));
    if(!pool.length)return undefined;
    if(!(nextPick&&nextPick.cur===cur&&pool.includes(nextPick.item)))nextPick={cur,item:pool[Math.floor(Math.random()*pool.length)]};
    return nextPick.item;
  }
  const rest=items.slice(items.indexOf(cur)+1);
  return scopePinned()?rest.find(x=>p.has(x.file)):rest[0];
}
async function playShuffle(pinned){
  const p=pinSet(),pool=items.filter(x=>!pinned||p.has(x.file));if(!pool.length)return;
  runId++;played.clear();nextPick=null;shuffleRun=true;pinRun=!!pinned;
  const first=pool[Math.floor(Math.random()*pool.length)];
  if(!(await open(first,true))){pinRun=false;shuffleRun=false;return}
  const ok=first.audio?await recWait:false;
  if(cur===first)startBest(ok);
}

async function playPinned(){
  const p=pinSet(),first=items.find(x=>p.has(x.file));if(!first)return;
  runId++;pinRun=true;
  if(!(await open(first,true))){pinRun=false;return}
  const ok=first.audio?await recWait:false;
  if(cur===first)startBest(ok);
}
async function advance(){
  const my=runId,n=nextAuto();
  if(!n){const m=shuffleOn()?'Shuffle finished: each essay was played once.':scopePinned()?'End of pinned essays.':'';if(m)toast(m);pinRun=false;shuffleRun=false;stopSpeech();updStatus();return}
  await new Promise(r=>setTimeout(r,1000));
  if(my!==runId)return;
  if(!(await open(n,true))){pinRun=false;shuffleRun=false;stopSpeech();return}
  if(my!==runId||cur!==n)return;
  const ok=n.audio?await recWait:false;
  if(my!==runId||cur!==n)return;
  startBest(ok);
}
function startBest(ok){
  $('#tapBtn').hidden=true;
  if(ok&&$('#preferRec').checked){setMode('rec');aud.currentTime=0;aud.play().catch(showTap)}
  else{setMode('voice');if(synth)beginRead();else showTap()}
}
function showTap(){$('#tapBtn').hidden=false;toast('Playback was blocked. Press Tap to continue.')}
$('#tapBtn').onclick=()=>{$('#tapBtn').hidden=true;if(mode==='rec')aud.play().catch(showTap);else if(synth)beginRead()};
function updStatus(){
  const i=items.indexOf(cur);
  if(i<0){$('#status').textContent='';return}
  $('#status').textContent='Essay '+(i+1)+' of '+items.length+' \u00b7 '+(mode==='rec'?'My recording':'Default voice')+(shuffleOn()?' \u00b7 shuffle':'')+(pinRun?' \u00b7 pinned playlist':'');
  $('#ePrev').disabled=i<=0;$('#eNext').disabled=i>=items.length-1;
}
async function step(d,force){
  const n=(d===1&&shuffleOn())?nextAuto():items[items.indexOf(cur)+d];if(!n)return;
  const playing=state==='playing'||(mode==='rec'&&!aud.paused);
  runId++;
  if(!(await open(n,true))||!(playing||force))return;
  const ok=n.audio?await recWait:false;
  if(cur===n)startBest(ok);
}
$('#ePrev').onclick=()=>step(-1);$('#eNext').onclick=()=>step(1);
function prefetchNext(){
  const n=nextAuto();if(!n)return;
  fetch(n.file).catch(()=>{});
  if(n.audio){const a=new Audio();a.preload='metadata';a.src=n.audio}
}
function setSession(){
  if(!('mediaSession' in navigator)||!cur)return;
  try{
    const ms=navigator.mediaSession;
    ms.metadata=new MediaMetadata({title:cur.title,artist:'Created by MANA',album:'My Essays'});
    ms.setActionHandler('play',()=>{if(mode==='rec')aud.play()});
    ms.setActionHandler('pause',()=>aud.pause());
    ms.setActionHandler('nexttrack',()=>step(1,true));
    ms.setActionHandler('previoustrack',()=>step(-1,true));
  }catch(e){}
}
aud.onended=()=>{if(mode==='rec'&&($('#auto').checked||pinRun||shuffleRun))advance()};

/* Default voice reader: sentence by sentence with highlight */
function setUI(){$('#playBtn').textContent=state==='playing'?'Pause':state==='paused'?'Resume':'Listen';$('#stopBtn').hidden=state==='idle'}
function loadVoices(){
  const sc=v=>(/natural|neural|premium|enhanced|siri/i.test(v.name)?3:0)+(v.localService===false?2:0)+(/google|microsoft/i.test(v.name)?1:0);
  voices=synth.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>sc(b)-sc(a)||a.lang.localeCompare(b.lang)||a.name.localeCompare(b.name));
  const sel=$('#voice');sel.textContent='';
  voices.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=(sc(v)>=2?'\u2605 ':'')+v.name+' ('+v.lang+')';sel.append(o)});
  if(prefs.voice&&voices.some(v=>v.voiceURI===prefs.voice))sel.value=prefs.voice;
  sel.hidden=!voices.length;
}
function mkUtt(text){
  const u=new SpeechSynthesisUtterance(text),v=voices.find(v=>v.voiceURI===$('#voice').value);
  if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';
  u.rate=parseFloat($('#rate').value)||1;u.pitch=parseFloat($('#pitch').value)||1;return u;
}
function mark(el){document.querySelectorAll('.s.on').forEach(x=>x.classList.remove('on'));if(el){el.classList.add('on');el.scrollIntoView({block:'center',behavior:'smooth'})}}
function speakNext(t){
  if(t!==tok)return;
  if(qi>=q.length){finish();return}
  const el=q[qi];
  if(!el.textContent.trim()){qi++;speakNext(t);return}
  mark(el);
  const u=mkUtt(el.textContent.trim());
  u.onend=()=>{if(t===tok){qi++;setTimeout(()=>speakNext(t),parseInt($('#pause').value)||0)}};
  u.onerror=ev=>{if(t!==tok)return;if(ev.error==='not-allowed'){state='idle';setUI();showTap();return}if(ev.error!=='interrupted'&&ev.error!=='canceled'){qi++;speakNext(t)}};
  synth.speak(u);
}
function beginRead(){stopListen();q=[...document.querySelectorAll('#vBody .s')];qi=0;state='playing';synth.cancel();speakNext(++tok);setUI()}
function finish(){
  if($('#auto').checked||pinRun||shuffleRun){advance();return}
  stopSpeech();
}
function stopSpeech(){runId++;haltSpeech();stopListen()}
function haltSpeech(){if(!synth)return;tok++;synth.cancel();state='idle';mark(null);setUI()}
if(!synth){$('#tts').hidden=true;$('#playBtn').hidden=true}else{
  loadVoices();synth.onvoiceschanged=loadVoices;
  if(prefs.rate)$('#rate').value=prefs.rate;
  if(prefs.pitch)$('#pitch').value=prefs.pitch;
  if(prefs.pause!==undefined)$('#pause').value=prefs.pause;
  $('#auto').checked=!!prefs.auto;
  $('#voice').onchange=$('#rate').onchange=$('#pitch').onchange=$('#pause').onchange=$('#auto').onchange=()=>{
    prefs.voice=$('#voice').value;prefs.rate=$('#rate').value;prefs.pitch=$('#pitch').value;prefs.pause=$('#pause').value;prefs.auto=$('#auto').checked;save()};
  $('#testVoice').onclick=()=>{stopSpeech();synth.speak(mkUtt('This is how this voice sounds. Your essays will be read to you like this.'))};
  $('#playBtn').onclick=()=>{
    if(state==='playing'){synth.pause();state='paused'}
    else if(state==='paused'){synth.resume();state='playing'}
    else beginRead();
    setUI();
  };
  $('#stopBtn').onclick=()=>{pinRun=false;shuffleRun=false;stopSpeech()};
  window.addEventListener('pagehide',()=>synth.cancel());
}

let tl=null,ltok=0,lwake=null;
const IPA=[['a\u026a','eye'],['e\u026a','ay'],['\u0254\u026a','oy'],['a\u028a','ow'],['\u0259\u028a','oh'],['\u0251\u02d0','ah'],['i\u02d0','ee'],['u\u02d0','oo'],['\u0254\u02d0','aw'],['t\u0283','ch'],['d\u0292','j'],['\u0283','sh'],['\u0292','zh'],['\u03b8','th'],['\u00f0','th'],['\u014b','ng'],['\u0259','schwa'],['\u026a','ih'],['\u028a','uh'],['\u00e6','a'],['\u028c','uh'],['\u0252','o']];
function ipaSay(x){
  x=x.replace(/:/g,'\u02d0');
  if(/[^\x00-\x7F]/.test(x)){IPA.forEach(([k,v])=>{x=x.split(k).join(' '+v+' ')});return x.replace(/[^a-z ]/gi,'').replace(/\s+/g,' ').trim()}
  return x.length===1?x:null;
}
function cleanSpeech(t){
  return t.replace(/\/([^\/\s]{1,5})\/\s+(sound|phoneme)/gi,(m,x,w)=>{const a=ipaSay(x);return a===null?m:a+' '+w})
   .replace(/\/([^\/\s]{1,5})\//g,(m,x)=>{const a=ipaSay(x);return a===null?m:(a==='schwa'?a:(a?'the sound '+a:''))})
   .replace(/\u2192/g,' becomes ').replace(/\bi\.e\./g,'that is').replace(/\be\.g\./g,'for example').replace(/\bvs\.?/gi,'versus').replace(/[\u2605\u2606]/g,'').replace(/\s{2,}/g,' ').trim();
}


function lSegs(t){
  const m=tl.mode,T={k:'term',x:t.t},D={k:'def',x:t.d},E={k:'ex',x:'Example. '+t.e};
  return m==='recall'?[T,{k:'wait'},D,E]:m==='short'?[T,D]:[T,D,E];
}
function lRelease(){if(lwake){try{lwake.release()}catch(e){}lwake=null}}
function stopListen(){ltok++;if(tl&&synth)synth.cancel();tl=null;lRelease()}
function paintL(){
  if(!tl||!$('#lTerm'))return;
  const t=tl.list[tl.i],segs=lSegs(t),cur=segs[Math.min(tl.s,segs.length-1)].k;
  const di=segs.findIndex(x=>x.k==='def'),ei=segs.findIndex(x=>x.k==='ex'),rc=tl.mode==='recall';
  $('#lProg').textContent='Term '+(tl.i+1)+' of '+tl.list.length+(tl.state==='paused'?' (paused)':'')+(tl.waiting?'. Your turn: say the definition aloud.':'');
  $('#lTerm').textContent=t.t;$('#lTerm').classList.toggle('on',cur==='term'&&tl.state==='playing');
  $('#lDef').textContent=!rc||tl.s>=di?t.d:'\u2026';$('#lDef').classList.toggle('on',cur==='def'&&tl.state==='playing');
  $('#lEx').hidden=ei<0;$('#lEx').textContent=!rc||tl.s>=ei?'Example: '+t.e:'\u2026';$('#lEx').classList.toggle('on',cur==='ex'&&tl.state==='playing');
  $('#lPlay').textContent=tl.state==='playing'?'Pause':(tl.i>0||tl.s>0?'Resume':'Start');
}
function runSeg(my){
  if(my!==ltok||!tl)return;
  const t=tl.list[tl.i],segs=lSegs(t);
  if(tl.s>=segs.length){
    setTimeout(()=>{
      if(my!==ltok||!tl)return;
      tl.i++;tl.s=0;
      if(tl.i>=tl.list.length){
        if($('#lLoop').checked){tl.i=0;if($('#lShuf').checked)shuffle(tl.list)}
        else{tl.i=tl.list.length-1;tl.s=0;tl.state='paused';lRelease();paintL();toast('Finished the list.');return}
      }
      paintL();runSeg(my);
    },900);return;
  }
  const sg=segs[tl.s];paintL();
  const next=()=>{if(my!==ltok||!tl)return;tl.waiting=false;tl.s++;setTimeout(()=>runSeg(my),sg.k==='term'?450:300)};
  if(sg.k==='wait'){tl.waiting=true;paintL();setTimeout(()=>{if(my===ltok&&tl)next()},tl.wait*1000);return}
  const u=mkUtt(cleanSpeech(sg.x));u.onend=next;
  u.onerror=ev=>{if(my===ltok&&ev.error!=='interrupted'&&ev.error!=='canceled')next()};
  synth.cancel();synth.speak(u);
}
function lPlay(){
  if(!tl)return;tl.state='playing';ltok++;paintL();
  if('wakeLock' in navigator&&!lwake){try{navigator.wakeLock.request('screen').then(x=>{lwake=x;x.addEventListener('release',()=>{lwake=null})}).catch(()=>{})}catch(e){}}
  runSeg(ltok);
}
function lPause(){ltok++;synth.cancel();if(tl){tl.state='paused';tl.waiting=false}lRelease();paintL()}
function lMove(d){
  if(!tl)return;const playing=tl.state==='playing';ltok++;synth.cancel();
  tl.i=Math.max(0,Math.min(tl.list.length-1,tl.i+d));tl.s=0;tl.waiting=false;
  if(playing)lPlay();else paintL();
}

  [['full','Term, definition, example'],['short','Term and definition only'],['recall','Recall: term, pause, answer']].forEach(([v,t])=>ms2.append(new Option(t,v)));ms2.value=tl.mode;
  ms2.setAttribute('aria-label','Listening mode');
  ms2.onchange=()=>{tl.mode=ms2.value;prefs.lMode=tl.mode;save();ws.hidden=tl.mode!=='recall';const was=tl.state==='playing';ltok++;synth.cancel();tl.s=0;if(was)lPlay();else paintL()};

  if(!a&&!b)return;

Promise.all([eP,gP,pP,tP,wP,xP,gmP,bP]).then(()=>{
  Object.keys(xbase).forEach(id=>{prac[id]=xbase[id]});Object.keys(xrd).forEach(id=>{prac[id]=xrd[id]});

});
